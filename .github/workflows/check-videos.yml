name: Weekly video check

on:
  schedule:
    - cron: "17 14 * * 1"   # every Monday at 14:17 UTC (about 8–9 AM Central)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write            # to save status/last-check.json (keeps the schedule active)
  issues: write              # to open an issue when a video breaks

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check every YouTube video
        id: check
        run: python check_videos.py

      - name: Open an issue if something broke
        if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f broken.md ]; then
            gh issue create --title "Broken technique video(s) found $(date -u +%F)" --body-file broken.md
          fi

      - name: Record the check (keeps GitHub from pausing this schedule)
        if: always()
        run: |
          git config user.name "video-check-bot"
          git config user.email "video-check-bot@users.noreply.github.com"
          git add status/last-check.json
          git commit -m "Weekly video check $(date -u +%F)" || echo "nothing to commit"
          git push || echo "push skipped"
